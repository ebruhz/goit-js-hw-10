name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # ya da master, hangi ana branch'i kullanıyorsan

permissions: # 1) BU BLOĞU EKLE (Eğer en üstte yoksa)
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      # ... (burada projenin derleme/build adımları, npm install vb. olabilir) ...

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.0
        with:
          branch: gh-pages # Dağıtılacak branch
          folder: dist # Loglarında gördüğüm derlenmiş klasörün (dist)
          token: ${{ secrets.GITHUB_TOKEN }} # 2) BU SATIRI MUTLAKA EKLE
